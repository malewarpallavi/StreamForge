spring.application.name=streamforge

spring.datasource.url=jdbc:mysql://localhost:3306/streamforge
spring.datasource.username=streamforge_user
spring.datasource.password=Stream@2026Forge
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# CRITICAL - default multipart limit is 1MB, will reject real video files
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# where uploaded files land on disk
video.storage.location=./video-storage
